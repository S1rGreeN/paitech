name: Django CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: ""
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6.0.2

      - name: Configurar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar comprobaciones
        run: python manage.py check

      - name: Ejecutar pruebas
        run: python manage.py test

      - name: Validar configuración y estáticos de Vercel sin conectar a Neon
        env:
          VERCEL: "1"
          DEBUG: "False"
          SECRET_KEY: ci-only-vercel-key-that-is-long-enough-for-django-checks-123456789
          ALLOWED_HOSTS: paipay-ci.vercel.app
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/test?sslmode=require
        run: |
          python manage.py check
          python manage.py collectstatic --noinput
